name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 13 unit tests (each named for the law it verifies)
        run: python test_vba.py
      - name: End-to-end demo on the two recorded real falls
        run: python vba.py
      - name: Hybrid eval - recorded-failure probes (SL-hybrid-eval v1.0)
        run: python eval/test_eval.py
      - name: Measurement pipeline (dry-run - pipeline test, not a result)
        run: python run_izmera.py --mode dry-run --out pipeline-test.json --report pipeline-test.md
