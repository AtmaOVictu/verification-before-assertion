name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 13 unit tests (each named for the law it verifies)
        run: python test_vba.py
      - name: Draft gate unit tests (the gate is code, not prose)
        run: python test_preverba.py
      - name: VBL-VP acceptance tests (the verification protocol is code, not prose)
        run: python test_vbl_protocol.py
      - name: Draft gate - sealed outreach draft vs the repository's measured bodies
        run: python preverba.py
      - name: End-to-end demo on the two recorded real falls
        run: python vba.py
      - name: Hybrid eval - recorded-failure probes (SL-hybrid-eval v1.0)
        run: python eval/test_eval.py
      - name: Measurement pipeline (dry-run - pipeline test, not a result)
        run: python run_izmera.py --mode dry-run --out pipeline-test.json --report pipeline-test.md
