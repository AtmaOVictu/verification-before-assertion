name: Izmera zivi tek

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model za zivi tek (npr. cjvt/GaMS-9B-Instruct ali mistral-large-latest)'
        required: false
        default: mistral-large-latest
      mode:
        description: 'Nacin: dry-run ali live'
        required: false
        default: 'live'
  push:
    branches:
      - main
    paths:
      - 'prompts-v1.0.json'
      - 'wordlist-v0.6-demo.json'
      - 'run_izmera.py'
      - 'IZMERNI-PROTOKOL.md'
      - '.github/workflows/izmera.yml'

permissions:
  contents: write

jobs:
  izmera:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Teka izmere - dry-run preverba cevovoda
        run: python3 run_izmera.py --mode dry-run

      - name: Zivi tek (ce zeton obstaja)
        if: ${{ inputs.mode == 'live' || github.event_name == 'push' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          IZMERA_MODEL: ${{ inputs.model || 'mistral-large-latest' }}
        run: |
          if [ -n "$HF_TOKEN" ] && [[ "$IZMERA_MODEL" == cjvt/* ]]; then
            python3 run_izmera.py --mode live --model "$IZMERA_MODEL"
          elif [ -n "$MISTRAL_API_KEY" ]; then
            python3 run_izmera.py --mode live --model "$IZMERA_MODEL"
          else
            echo "NO_TOKEN - zeton se ni vnesel v Secrets; rezultat ostaja dry-run (register vnos 5)"
            echo "Dry-run ze potrjen v prejnjem koraku - izhod ostaja veljaven, brez laznega 'live'"
            exit 0
          fi

      - name: Poročilo po dejanju - shrani izide
        run: |
          git config user.name "izmera-bot"
          git config user.email "actions@github.com"
          git add rezultat-v1.0.md results-v1.0.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Ni sprememb za objavo"
          else
            git commit -m "izmera: zivi tek izveden (Z4 - porocilo po dejanju) [skip ci]"
            git push
          fi
