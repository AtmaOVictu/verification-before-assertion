name: Izmera — živi tek (Z4: požene se samo z ročnim sprožilom)

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model za živi tek (npr. cjvt/GaMS-9B-Instruct ali mistral-large-latest)'
        required: false
        default: 'cjvt/GaMS-9B-Instruct'
      mode:
        description: 'Način: dry-run ali live'
        required: false
        default: 'live'

permissions:
  contents: write

jobs:
  izmera:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tekač izmere — dry-run preverba cevovoda
        run: python3 run_izmera.py --mode dry-run

      - name: Živi tek (če mode=live in žeton obstaja)
        if: ${{ inputs.mode == 'live' && (secrets.HF_TOKEN != '' || secrets.MISTRAL_API_KEY != '') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -n "$HF_TOKEN" ] && [[ "${{ inputs.model }}" == cjvt/* ]]; then
            python3 run_izmera.py --mode live --model "${{ inputs.model }}"
          elif [ -n "$MISTRAL_API_KEY" ]; then
            python3 run_izmera.py --mode live --model "${{ inputs.model }}"
          else
            echo "⚠ Noben žeton ni dosegljiv — rezultat ostaja dry-run (register vnos 5)"
            exit 1
          fi

      - name: Poročilo po dejanju — shrani izide
        run: |
          git config user.name "izmera-bot"
          git config user.email "actions@github.com"
          git add rezultat-v1.0.md results-v1.0.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Ni sprememb za objavo"
          else
            git commit -m "izmera: živi tek izveden (Z4 — poročilo po dejanju) [skip ci]"
            git push
          fi
